# vLLM serving Qwen3-Coder-Next-NVFP4 on the DGX Spark (GB10 / SM121).
#
# Image is a third-party community build (vLLM 0.16.0-rc2 with custom NVFP4
# kernels) — it is what the model card specifies and what the GB10 community
# uses; there is no NGC vLLM image with these kernels for GB10.
#
# Deployed to ~/dgx-spark-obs/vllm on gx10 and managed by vllm-coder-next.service.

name: dgx-spark-vllm

services:
  vllm:
    image: avarok/dgx-vllm-nvfp4-kernel:v23
    container_name: dgxspark-vllm
    restart: unless-stopped
    ipc: host
    shm_size: 32gb
    ports:
      # Host 8006 matches the upstream README's documented scrape target,
      # so prometheus.yml on lake1 needs no change.
      - "8006:8000"
    volumes:
      - ${MODEL_DIR:-/home/mwiget/models}/Qwen3-Coder-Next-NVFP4-GB10:/models/Qwen3-Coder-Next-NVFP4-GB10:ro
    environment:
      # NVFP4 kernel selection for GB10 — all four are required by the model card.
      VLLM_NVFP4_GEMM_BACKEND: marlin
      VLLM_TEST_FORCE_FP8_MARLIN: "1"
      VLLM_USE_FLASHINFER_MOE_FP4: "0"
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
      MODEL: /models/Qwen3-Coder-Next-NVFP4-GB10
      PORT: "8000"
      MAX_MODEL_LEN: "262144"
      # The entrypoint always emits --max-num-seqs, so set it here rather than
      # in VLLM_EXTRA_ARGS — otherwise the flag appears twice on the command line.
      MAX_NUM_SEQS: "64"
      # NOT the model card's 0.90. GB10 memory is unified, so the host's own
      # ~20 GiB (k3s, FRR, other containers) comes out of the same 121.63 GiB
      # pool: only ~101 GiB is free at startup, and 0.90 (109.46 GiB) makes vLLM
      # abort with "Free memory on device cuda:0 ... is less than desired".
      # Ceiling is ~0.83; 0.80 leaves headroom for host memory to fluctuate.
      GPU_MEMORY_UTIL: "0.80"
      # The entrypoint does `exec ${VLLM_CMD}` with an UNQUOTED expansion and no
      # eval, so every argument here is split on whitespace and quote characters
      # pass through literally. The --speculative-config JSON must therefore stay
      # compact with no spaces, and must NOT be wrapped in quotes.
      #
      # DO NOT enable --speculative-config with this model. Measured here:
      # ngram gives 2.07x on code-editing prompts (126 vs 61 tok/s) at
      # concurrency 1, but Qwen3-Next's Gated DeltaNet attention backend cannot
      # mix speculative and non-speculative decodes in one batch:
      #   gdn_attn.py: assert not (num_decodes > 0 and num_spec_decodes > 0)
      #   AssertionError: num_decodes: 2, num_spec_decodes: 2 -> EngineDeadError
      # That kills the whole engine, not just the request, as soon as a second
      # request overlaps. This checkpoint also has zero MTP/nextn tensors, so
      # qwen3_next_mtp is unavailable too. Spec decoding needs a different model.
      #
      # NB: a SERVED_MODEL_NAME env var is ignored by this image — without the
      # flag below, /v1/models reports the id as "/models/Qwen3-Coder-Next-NVFP4-GB10"
      # and clients have to send that full path as the model name.
      VLLM_EXTRA_ARGS: >-
        --served-model-name qwen3-coder-next
        --kv-cache-dtype fp8
        --attention-backend flashinfer
        --enable-prefix-caching
        --enable-chunked-prefill
        --max-num-batched-tokens 8192
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
    # The image ships a healthcheck hardcoded to port 8888, which never matches
    # the port we serve on. Override it so container health reflects reality.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # A 42.7 GiB NVFP4 checkpoint takes several minutes to load.
      start_period: 15m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
