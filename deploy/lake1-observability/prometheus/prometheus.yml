# 5s scrape interval matches the dashboard's 5s auto-refresh default.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    monitor: dgx-spark

scrape_configs:
  # vLLM OpenAI server on the DGX Spark. Serves vllm:* metrics.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["gx10:8006"]

  # Host telemetry for the DGX Spark system-utilization panels.
  - job_name: node
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["gx10:9100"]
        labels: {host: gx10}

  # gx10 GPU: GB10, via nvidia_gpu_exporter (nvidia-smi). Container gx10-gpu-exporter,
  # --gpus all; the Spark dashboard's own GPU panel only reads vLLM's KV-cache usage.
  - job_name: gx10-gpu
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["gx10:9835"]
        labels: {host: gx10}

  # llama-server on gx10 when it runs instead of vLLM (Qwen3.8-Flash-Next IQ3_S, 2026-10-02).
  # Started with --metrics --host 100.67.215.111 (Tailscale only, no API key) --port 18091.
  # DOWN whenever llama-server is not running - expected.
  - job_name: gx10-llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["gx10:18091"]
        labels: {host: gx10}

  # lake1 host telemetry (deploy/lake1-exporters).
  - job_name: lake1-node
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["192.168.68.113:9100"]
        labels: {host: lake1}

  # lake1 GPU: RTX PRO 5000 Blackwell, via nvidia_gpu_exporter (nvidia-smi).
  - job_name: lake1-gpu
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["192.168.68.113:9835"]
        labels: {host: lake1}

  # llama-server behind ../claude-local. Needs BOTH --metrics and a bind address
  # the Prometheus container can reach; it currently listens on 127.0.0.1 only,
  # so this target stays DOWN until serve-lake1.sh is updated and restarted.
  - job_name: llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.68.113:8090"]
        labels: {host: lake1}
