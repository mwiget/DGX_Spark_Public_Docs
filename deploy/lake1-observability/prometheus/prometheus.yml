# 5s scrape interval matches the dashboard's 5s auto-refresh default.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    monitor: dgx-spark

scrape_configs:
  # vLLM OpenAI server on the DGX Spark. Serves vllm:* metrics.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["gx10:8006"]

  # Host telemetry for the DGX Spark system-utilization panels.
  - job_name: node
    static_configs:
      - targets: ["gx10:9100"]
