# 5s scrape interval matches the dashboard's 5s auto-refresh default.
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    monitor: dgx-spark

scrape_configs:
  # vLLM OpenAI server on the DGX Spark. Serves vllm:* metrics.
  # Since 2026-10-06: Qwen3.6-35B-A3B (qwen36.service, port 8896); Kolibri-1 on 8895
  # earlier that day, gx10:8006 before. Point this at whichever server is running.
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["gx10:8896"]
        labels: {host: gx10}

  # Host telemetry for the DGX Spark system-utilization panels.
  - job_name: node
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["gx10:9100"]
        labels: {host: gx10}

  # gx10 GPU: GB10, via nvidia_gpu_exporter (nvidia-smi). Container gx10-gpu-exporter,
  # --gpus all; the Spark dashboard's own GPU panel only reads vLLM's KV-cache usage.
  - job_name: gx10-gpu
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["gx10:9835"]
        labels: {host: gx10}

  # llama-server on gx10 when it runs instead of vLLM (Qwen3.8-Flash-Next IQ3_S, 2026-10-02).
  # Started with --metrics --host 100.67.215.111 (Tailscale only, no API key) --port 18091.
  # DOWN whenever llama-server is not running - expected.
  - job_name: gx10-llamacpp
    metrics_path: /metrics
    static_configs:
      - targets: ["gx10:18091"]
        labels: {host: gx10}

  # lake1 host telemetry (deploy/lake1-exporters).
  - job_name: lake1-node
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["192.168.68.113:9100"]
        labels: {host: lake1}

  # lake1 GPU: RTX PRO 5000 Blackwell, via nvidia_gpu_exporter (nvidia-smi).
  - job_name: lake1-gpu
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets: ["192.168.68.113:9835"]
        labels: {host: lake1}

  # lake1's LLM servers behind ../claude-local and airouter `big`. Since 2026-11-07
  # llama-swap on :8091 swaps two Strata models on the one GPU by request model name;
  # each Strata listens on its own fixed port, scraped here directly (llama-swap does
  # not pass /metrics/prometheus, and its /upstream/ route would load the model):
  #   :18092 Qwen3.8-Flash-Next IQ3_S (default)   :18091 DeepSeek V4.1 Flash 1017
  # Exactly one is UP at a time (none during `lake1-gpu media`) - expected.
  # Strata's Prometheus text is at /metrics/prometheus (/metrics is JSON) and uses
  # llama.cpp-compatible names (llamacpp:*) plus strata:*, so the job name stays.
  # 2026-11-06: DeepSeek only, :8091. Before: Qwen3.8-27B llama-server on :8090.
  - job_name: llamacpp
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ["192.168.68.113:18092"]
        labels: {host: lake1, engine: strata, model: qwen3.8-flash-next-iq3_s}
      - targets: ["192.168.68.113:18091"]
        labels: {host: lake1, engine: strata, model: deepseek-v4.1-flash}
