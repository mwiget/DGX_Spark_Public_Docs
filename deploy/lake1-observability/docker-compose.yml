# DGX Spark observability stack — runs on lake1, scrapes gx10.
#
# Deliberately separate from the bnkscope stack: that Grafana is 11.4.0, and the
# upstream dashboard is schema v2 (elements + layout), which needs Grafana 13.x
# plus the dashboardNewLayouts / kubernetesDashboards feature toggles.
#
# Ports 3000, 9090 and 9491 are already in use on lake1, hence 3001 / 9494.

name: dgx-spark-obs

services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: dgxspark-prometheus
    restart: unless-stopped
    ports:
      - "9494:9090"
    # gx10 resolves via Tailscale MagicDNS on the host only; systemd-resolved at
    # 127.0.0.53 is not reachable from inside the container, so pin it here.
    extra_hosts:
      - "gx10:100.67.215.111"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:13.1.4
    container_name: dgxspark-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # Required to render the upstream schema-v2 dashboard.
      GF_FEATURE_TOGGLES_ENABLE: dashboardNewLayouts,kubernetesDashboards
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
